[tool.ruff]
line-length = 150
target-version = "py311"
exclude = ["features/reports", "features/logs", "features/results", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "PT", "RUF"]
ignore = ["S101", "S105", "S106", "S311", "B008", "E501", "UP007", "F403", "F405", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["ANN", "S", "PT"]
"features/tests/**" = ["ANN", "S", "PT"]
"features/pages/**" = ["ANN", "S", "N"]
"features/services/**" = ["ANN", "S", "N"]
"features/utils/config_manager.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["features"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_generics = false
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["features/reports/", "features/logs/", "__pycache__/", ".venv/", "venv/"]

[tool.pip-tools]
no-emit-index-url = true

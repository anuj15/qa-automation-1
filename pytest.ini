# pytest configuration for the {{PROJECT_NAME}} QA automation suite.
# Custom markers are declared here to satisfy --strict-markers
# and to allow precise test selection via -m "<marker>" in CI and locally.
#
# Marker categories:
#   Execution control — bvt, dev_only, pr_check, skip_test
#   Test type         — ui, api, database
#   Feature area      — add your feature markers here

[pytest]
testpaths = features/tests

filterwarnings =
    ignore::DeprecationWarning

markers =
# ── Execution control ──────────────────────────────────────────────
    bvt:                        Build verification tests (smoke tests)
    dev_only:                   Tests to run only in local development
    pr_check:                   Tests to run on every PR
    skip_test:                  Tests temporarily excluded from the run

# ── Test type ──────────────────────────────────────────────────────
    ui:                         All UI tests
    api:                        All API tests
    database:                   Tests that interact directly with a database

# ── Feature areas (add your own markers here) ─────────────────────
    sample_feature:             Sample feature tests
    authentication:             Authentication and login tests
    data_validation:            Data validation tests

# ── Additional markers for test organization ───────────────────────
    smoke:                      Fast smoke tests for quick validation
    regression:                 Full regression test suite
    performance:                Performance and load tests
